name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  xcode:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Swift format
        run: xcrun swift-format lint --recursive Sources Tests Package.swift

      - name: Swift package tests
        run: swift test

      - name: Regenerate Mail bridge
        run: ./Scripts/generate-mail-bridge.sh

      - name: Build
        run: |
          xcodebuild \
            -project ApplePlatformMCP.xcodeproj \
            -scheme ApplePlatformMCP \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/apple-platform-mcp-derived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/apple-platform-mcp-packages" \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build

      - name: Test
        run: |
          xcodebuild \
            -project ApplePlatformMCP.xcodeproj \
            -scheme ApplePlatformMCP \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/apple-platform-mcp-test-derived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/apple-platform-mcp-test-packages" \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test

  remote:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: Remote
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: Remote
        run: bun run typecheck

      - name: Test
        working-directory: Remote
        run: bun test

      - name: Build bundle
        working-directory: Remote
        run: bun run build

  release:
    name: release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Verify unsigned universal Release archive
        run: |
          xcodebuild -project ApplePlatformMCP.xcodeproj -scheme ApplePlatformMCP \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/ApplePlatformMCP.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/release-derived" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            APPLE_PLATFORM_MCP_BUILD_COMMIT="$GITHUB_SHA" archive
          app="$RUNNER_TEMP/ApplePlatformMCP.xcarchive/Products/Applications/apple-platform-mcp.app"
          test -x "$app/Contents/MacOS/apple-platform-mcp"
          lipo "$app/Contents/MacOS/apple-platform-mcp" -verify_arch arm64 x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.dariuscorvus.apple-platform-mcp"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ApplePlatformMCPBuildCommit' "$app/Contents/Info.plist")" = "$GITHUB_SHA"
