# Release: build, sign, notarize, staple, and publish a macOS DMG.
#
# Tagged releases require signing and notarization credentials. workflow_dispatch
# remains a dry run and uploads a signed DMG as a workflow artifact without
# publishing a GitHub release; notarization is optional for that dry run.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    env:
      HAS_SIGNING_CREDENTIALS: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_NOTARY_CREDENTIALS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Config/ApplePlatformMCP-Info.plist)
          case "${GITHUB_REF_NAME}" in
            "v$version")
              echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
              ;;
            "v$version"-*)
              echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Tag ${GITHUB_REF_NAME} does not match app version $version" >&2
              echo "Expected v$version or v$version-*" >&2
              exit 1
              ;;
          esac

      - name: Require release credentials
        run: |
          test "$HAS_SIGNING_CREDENTIALS" = "true" || {
            echo "Signing secrets are required for every release build; refusing an unsigned artifact." >&2
            exit 1
          }
          if [ "${{ github.event_name }}" = "push" ] && [ "$HAS_NOTARY_CREDENTIALS" != "true" ]; then
            echo "Notarization secrets are required for tagged releases." >&2
            exit 1
          fi

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Run tests
        run: swift test

      - name: Import signing certificate
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p ci-keychain "$RUNNER_TEMP/ci.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/ci.keychain-db"
          security unlock-keychain -p ci-keychain "$RUNNER_TEMP/ci.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$RUNNER_TEMP/ci.keychain-db" \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k ci-keychain \
            "$RUNNER_TEMP/ci.keychain-db"
          echo "SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"

      - name: Archive signed app
        run: |
          archive_path="$RUNNER_TEMP/apple-platform-mcp.xcarchive"
          xcodebuild \
            -project ApplePlatformMCP.xcodeproj \
            -scheme ApplePlatformMCP \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$archive_path" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/apple-platform-mcp-packages" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            APPLE_PLATFORM_MCP_BUILD_COMMIT="$GITHUB_SHA" \
            archive
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      - name: Verify signed app
        run: |
          app_path="$ARCHIVE_PATH/Products/Applications/apple-platform-mcp.app"
          codesign --verify --deep --strict "$app_path"
          signature_details="$(codesign -dv --verbose=4 "$app_path" 2>&1 || true)"
          printf '%s\n' "$signature_details" | grep -E '^(Identifier|TeamIdentifier|Authority)='
          if printf '%s\n' "$signature_details" | grep -q '^Signature=adhoc$'; then
            echo "Release artifact is ad-hoc signed; a stable signing identity is required for macOS TCC upgrades." >&2
            exit 1
          fi
          if printf '%s\n' "$signature_details" | grep -q '# designated => cdhash'; then
            echo "Release artifact uses a cdhash-only designated requirement; stable upgrades are not allowed." >&2
            exit 1
          fi
          if ! printf '%s\n' "$signature_details" | grep -q '^TeamIdentifier='; then
            echo "Release artifact has no TeamIdentifier; refusing an unstable TCC identity." >&2
            exit 1
          fi

      - name: Create DMG
        run: |
          app_path="$ARCHIVE_PATH/Products/Applications/apple-platform-mcp.app"
          dmg_root="$RUNNER_TEMP/apple-platform-mcp-dmg"
          mkdir -p "$dmg_root"
          cp -R "$app_path" "$dmg_root/"
          hdiutil create \
            -volname "Apple Platform MCP" \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "$RUNNER_TEMP/apple-platform-mcp.dmg"
          echo "DMG_PATH=$RUNNER_TEMP/apple-platform-mcp.dmg" >> "$GITHUB_ENV"
          shasum -a 256 "$RUNNER_TEMP/apple-platform-mcp.dmg" \
            > "$RUNNER_TEMP/apple-platform-mcp.dmg.sha256"
          echo "DMG_SHA256_PATH=$RUNNER_TEMP/apple-platform-mcp.dmg.sha256" \
            >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        if: env.HAS_NOTARY_CREDENTIALS == 'true'
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --wait \
            --output-format json \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            | tee "$RUNNER_TEMP/notary-submit.json"
          submission_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary-submit.json")
          status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary-submit.json")
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$submission_id" \
              --output-format json \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}"
            exit 1
          fi
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Upload DMG artifact for dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: apple-platform-mcp-dmg
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_SHA256_PATH }}

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_args=()
          if [ "${IS_PRERELEASE:-false}" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "Apple Platform MCP ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${prerelease_args[@]}" \
            "$DMG_PATH" \
            "$DMG_SHA256_PATH"
